name: student-services-platform
services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-ssp-local-demo-only}
    volumes:
      - user-db-data:/var/lib/postgresql/data
      - ./services/user-service/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  user-service:
    build: ./services/user-service
    image: ghcr.io/${GHCR_OWNER:-adelsobhyy}/student-services-platform-user-service:${IMAGE_TAG:-local}
    init: true
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://user:${DEV_DB_PASSWORD:-ssp-local-demo-only}@user-db:5432/user
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      user-db:
        condition: service_healthy
    networks: [backend]
  accommodation-db:
    image: postgres:17-alpine
